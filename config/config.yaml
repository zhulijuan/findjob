llm:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash
  temperature: 1.0
  max_tokens: 2048
  timeout: 60
  usage_log: logs/usage.jsonl

  # 切换 Qwen（DashScope）示例，兼容 OpenAI 格式：
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # api_key_env: DASHSCOPE_API_KEY
  # model: qwen-plus

tasks:
  qa:
    description: 即问即答（配合 --ask 使用，可在此配置固定 system prompt）
    system_prompt: ""
    user_prompt: "{{ question }}"

  intro:
    description: 介绍类任务（演示模板变量）
    system_prompt: 你是一个简洁的助手
    user_prompt: 用一句话介绍 {{ topic }}。

  count:
    description: 数数任务（演示变量渲染）
    user_prompt: 从 1 数到 {{ n }}，用顿号分隔。

  reasoning:
    description: 推理任务（演示 thinking 与任务级模型覆盖）
    model: deepseek-v4-pro
    thinking: true
    user_prompt: 9.11 和 9.9 哪个大？给出理由。
