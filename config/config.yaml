llm:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash
  temperature: 1.0
  max_tokens: 2048
  timeout: 60
  usage_log: logs/usage.jsonl

  # 切换 Qwen（DashScope）示例，兼容 OpenAI 格式：
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # api_key_env: DASHSCOPE_API_KEY
  # model: qwen-plus

embedding:
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  model: BAAI/bge-m3
  batch_size: 16
  timeout: 60
  usage_log: logs/usage.jsonl

vectorstore:
  type: faiss
  index_path: data/index/credit_policy

rag:
  corpus_dir: data/corpus
  chunk_size: 400
  chunk_overlap: 50
  top_k: 5

retrieval:
  mode: hybrid              # vector | bm25 | hybrid
  bm25_candidates: 10       # BM25 路送融合的候选数
  vector_candidates: 10     # 向量路送融合的候选数
  rrf_k: 60                 # RRF 常数（惯例 60）
  rerank:
    enabled: false
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    model: BAAI/bge-reranker-v2-m3
    top_m: 10
  rewrite:
    enabled: false
  jieba_userdict: data/eval/userdict.txt

tasks:
  qa:
    description: 即问即答（配合 --ask 使用，可在此配置固定 system prompt）
    system_prompt: ""
    user_prompt: "{{ question }}"

  rewrite:
    description: 查询改写（配合 retrieval.rewrite.enabled 使用）
    temperature: 0.0
    system_prompt: 将用户的口语化信贷问题改写为适合检索的书面表述，补充同义词与关键术语，只输出改写后的查询，不要回答。
    user_prompt: "{{ question }}"

  rag:
    description: 基于信贷知识库问答（配合 --rag 使用）
    temperature: 0.1
    system_prompt: 你是信贷政策助手。仅依据提供的资料回答问题；资料中没有的内容明确说"资料中未提及"，不得编造；回答末尾列出引用的来源编号。
    user_prompt: |
      资料：
      {{ context }}

      问题：{{ question }}

  intro:
    description: 介绍类任务（演示模板变量）
    system_prompt: 你是一个简洁的助手
    user_prompt: 用一句话介绍 {{ topic }}。

  count:
    description: 数数任务（演示变量渲染）
    user_prompt: 从 1 数到 {{ n }}，用顿号分隔。

  reasoning:
    description: 推理任务（演示 thinking 与任务级模型覆盖）
    model: deepseek-v4-pro
    thinking: true
    user_prompt: 9.11 和 9.9 哪个大？给出理由。
